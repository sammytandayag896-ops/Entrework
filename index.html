<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrework - Young Entrepreneurs Forum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">🚀 Entrework</h1>
      <p class="tagline">Connect. Learn. Grow. Build.</p>
      <div class="nav-buttons">
        <button onclick="toggleProfileModal()" class="nav-btn">👤 Profile</button>
        <button onclick="toggleSettingsModal()" class="nav-btn">⚙️ Settings</button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h3>Categories</h3>
      <div class="category-list">
        <button class="category-btn active" onclick="filterByCategory('all')">All Posts</button>
        <button class="category-btn" onclick="filterByCategory('ideas')">💡 Ideas</button>
        <button class="category-btn" onclick="filterByCategory('startup')">🏢 Startups</button>
        <button class="category-btn" onclick="filterByCategory('funding')">💰 Funding</button>
        <button class="category-btn" onclick="filterByCategory('mentorship')">🎓 Mentorship</button>
        <button class="category-btn" onclick="filterByCategory('jobs')">💼 Jobs</button>
        <button class="category-btn" onclick="filterByCategory('networking')">🤝 Networking</button>
      </div>

      <div class="trending">
        <h3>Trending Tags</h3>
        <div id="trendingTags" class="tag-cloud"></div>
      </div>
    </aside>

    <!-- Main Feed -->
    <main class="main-feed">
      <!-- Create Post Section -->
      <div class="create-post-card">
        <div class="post-header">
          <input type="text" id="username" placeholder="Your name" class="username-input" maxlength="30">
          <select id="category" class="category-select">
            <option value="ideas">💡 Ideas</option>
            <option value="startup">🏢 Startups</option>
            <option value="funding">💰 Funding</option>
            <option value="mentorship">🎓 Mentorship</option>
            <option value="jobs">💼 Jobs</option>
            <option value="networking">🤝 Networking</option>
          </select>
        </div>
        <textarea id="postInput" placeholder="Share your idea, question, or experience..." rows="4" maxlength="500"></textarea>
        <input type="text" id="tagsInput" placeholder="Add tags (e.g., #tech #startup #ai) - optional">
        <div class="post-actions">
          <button onclick="addPost()" class="btn-primary">📤 Post</button>
          <button onclick="clearPostForm()" class="btn-secondary">Clear</button>
        </div>
      </div>

      <!-- Posts Feed -->
      <div id="feed" class="posts-feed"></div>
      <div id="noPostsMessage" class="no-posts">No posts yet. Be the first to share! 🎉</div>
    </main>
  </div>

  <!-- Modals -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="toggleProfileModal()">&times;</span>
      <h2>My Profile</h2>
      <div class="profile-section">
        <input type="text" id="profileName" placeholder="Your Name" maxlength="50">
        <textarea id="profileBio" placeholder="Tell us about yourself..." maxlength="200" rows="4"></textarea>
        <input type="text" id="profileTitle" placeholder="Your Title (e.g., Student, Founder)" maxlength="50">
        <button onclick="saveProfile()" class="btn-primary">Save Profile</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="toggleSettingsModal()">&times;</span>
      <h2>Settings</h2>
      <div class="settings-section">
        <label>
          <input type="checkbox" id="notificationsToggle" checked> Enable Notifications
        </label>
        <label>
          <input type="checkbox" id="darkModeToggle" checked> Dark Mode
        </label>
        <button onclick="clearAllData()" class="btn-danger">Clear All Data</button>
        <button onclick="toggleSettingsModal()" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <!-- Comment Modal -->
  <div id="commentModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeCommentModal()">&times;</span>
      <h2>Comments</h2>
      <div id="commentsList" class="comments-list"></div>
      <input type="text" id="commentInput" placeholder="Add a comment..." maxlength="300">
      <button onclick="addComment()" class="btn-primary">Comment</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
